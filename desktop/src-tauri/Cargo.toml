[package]
name = "cosmas-desktop-companion"
version = "0.1.0"
description = "Consent-gated virtual visit capture companion"
authors = ["CosmaNeura"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cosmas_desktop_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-keyring-store = { version = "0.2.0", default-features = false }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive", "serde"] }

[features]
default = []
# Reserved for a separately reviewed native SDK integration. There is no
# provider implementation in this dormant scaffold.
recall-provider = []
