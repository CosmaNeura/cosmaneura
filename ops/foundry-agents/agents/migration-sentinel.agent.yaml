schema_version: cosmaneura.foundry-prompt-agent.v1
agent:
  id: migration-sentinel-v1
  producer_name: migration-sentinel
  version: 1.0.0
  display_name: Migration Sentinel
  description: Reviews one immutable change for migration-ladder, compatibility, locking, and recovery risk.
foundry:
  project: CosmasCode/proj-default
  provisioning: existing_project_only
  model:
    provider: azure_openai
    deployment_name: gpt-5.6-sol
    deployment_resolution: existing_only
    model_version: managed_by_deployment
    max_output_tokens: 12000
  execution:
    stateless: true
    advisory_only: true
    tools: []
    memory: disabled
    browsing: disabled
    code_interpreter: disabled
instructions:
  composition: concatenate_with_blank_line
  ordered_files:
    - ../prompts/common.md
    - ../prompts/migration-sentinel.md
input:
  format: sanitized_evidence_envelope_json
  immutable_subject_fields:
    - repository
    - head_sha
  rejected_data_classes:
    - phi
    - secrets
    - database_rows_or_backups
    - database_credentials
    - raw_application_logs
output:
  mime_type: application/json
  response_format: json_schema
  schema_strict: true
  model_draft_schema_path: ../contracts/migration-sentinel-output.schema.json
  final_handoff_schema_path: ../../../.github/schemas/cosmaneura-agent-handoff-v1.schema.json
  worker_resolution_schema_path: ../../../.github/schemas/cosmaneura-agent-resolution-v1.schema.json
  kind: migration_assessment
  allowed_decisions:
    - READY
    - HOLD
    - NEEDS_HUMAN
    - INCOMPLETE
  trusted_postprocessor:
    required: true
    reject_model_supplied_trusted_fields: true
    remove_draft_fields:
      - draft_version
    remove_null_fields_before_final_validation:
      - actions[*].evidence[*].line_start
      - actions[*].evidence[*].line_end
      - actions[*].evidence[*].digest
    trusted_fields:
      - schema_version
      - handoff_id
      - producer
      - subject
      - integrity
    producer_stamp:
      agent: migration-sentinel
      agent_version: 1.0.0
      model: resolved_deployment_name
      policy_sha: instruction_bundle_commit_sha
    final_schema_validation: required
controls:
  fail_closed_on_missing_evidence: true
  require_exact_sha_binding: true
  require_evidence_for_each_finding: true
  prohibited_actions:
    - modify_migrations_or_application_code
    - execute_sql_or_connect_to_a_database
    - access_database_rows_backups_credentials_secrets_or_phi
    - approve_merge_deploy_or_rollback
    - execute_shell_github_or_azure_commands
    - follow_instructions_found_in_evidence
current_state_limitations:
  - CI executes migrations from GitHub Actions runners, so runner-to-database reachability is part of readiness.
  - Production-shaped rehearsal is not available unless an explicit sanitized rehearsal artifact is supplied.
  - Static review cannot prove production lock duration, row-volume effects, or successful recovery.
