name: Build & Publish (Staging)

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
  GH_TOKEN: ${{ github.token }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  STAGING_AZURE_CLIENT_ID: 45b940bf-2f4f-4b10-bcc3-4679d8855a6f
  STAGING_AZURE_TENANT_ID: d51754d0-bba5-4810-820e-afac542844d6
  STAGING_AZURE_SUBSCRIPTION_ID: bab2a709-1fcb-4c87-a9fc-802f7477ec13

  DATABASE_HOST: localhost
  REDIS_HOST: localhost
  SMTP_HOST: localhost

  COLUMNS: 120

jobs:
  app:
    name: Backend (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        timeout-minutes: 5
      - uses: iloveitaly/github-action-localias@master
        with:
          chrome: true
      - run: just up --fast
      - run: just py_setup
      - run: just py_lint
        continue-on-error: true
      - run: just db_migrate
      - run: just db_lint
        continue-on-error: true
      - run: just py_test

  web:
    name: Frontend (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        timeout-minutes: 5
      - run: just js_setup
      - run: just js_lint
        continue-on-error: true
      - run: just js_test

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web, app]
    if: ${{ github.ref == 'refs/heads/staging' && github.event_name == 'push' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        timeout-minutes: 5

      - uses: azure/login@v2
        with:
          client-id: ${{ env.STAGING_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.STAGING_AZURE_TENANT_ID }}
          subscription-id: ${{ env.STAGING_AZURE_SUBSCRIPTION_ID }}

      - name: Login to Staging ACR
        run: az acr login --name cosmaneurastagingregistry

      - name: Build application image
        run: just build

      - name: Push image to staging registry
        run: |
          docker tag cosmaneura:${{ github.sha }} cosmaneurastagingregistry.azurecr.io/cosmaneura/cosmaneura:${{ github.sha }}
          docker push cosmaneurastagingregistry.azurecr.io/cosmaneura/cosmaneura:${{ github.sha }}

          docker tag cosmaneura:${{ github.sha }} cosmaneurastagingregistry.azurecr.io/cosmaneura/cosmaneura:latest
          docker push cosmaneurastagingregistry.azurecr.io/cosmaneura/cosmaneura:latest

      - name: Deploy to Azure Staging
        run: |
          cd infra && bash deploy_staging.sh ${{ github.sha }}
