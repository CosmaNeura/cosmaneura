name: Terraform Apply

# Production apply is deliberately manual. Pull requests receive secretless
# validation and a provider-mocked static plan. The founder must then
# run infra_production_plan_local.yml on the exact current master commit and supply
# that successful run ID and immutable attestation digest here. Only the
# founder account may start or rerun either production workflow. This workflow
# independently recomputes a saved plan and applies it only when its canonical
# digest, configuration, provider lock, and state identity exactly match the
# reviewed attestation. The sensitive plan binary never leaves its runner.
#
# DO NOT REMOVE THE CONCURRENCY GROUP. Two parallel applies racing on
# the same state file can corrupt it.

on:
  workflow_dispatch:
    inputs:
      production_plan_run_id:
        type: string
        description: "Successful Terraform Production Plan run for the exact current master commit"
        required: true
      production_plan_artifact_digest:
        type: string
        description: "sha256: digest shown by the reviewed production-plan run"
        required: true

permissions:
  contents: read

# Serialize applies. cancel-in-progress: false means a queued apply
# waits for the current one to finish instead of being killed — losing
# half-applied state mid-flight is worse than waiting a few minutes.
concurrency:
  # Shared with the production image-deploy job. Infrastructure and image
  # updates must never create Container App revisions concurrently.
  group: cosmaneura-production-container-apps
  cancel-in-progress: false

jobs:
  authorize-production:
    name: Authorize production infrastructure apply
    runs-on: [self-hosted, Linux, ARM64, cosmaneura-production-local, "cosmaneura-production-local-${{ github.run_id }}"]
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require founder-authorized manual apply from master
        env:
          APPLY_ACTOR: ${{ github.actor }}
          APPLY_EVENT: ${{ github.event_name }}
          APPLY_REF: ${{ github.ref }}
          APPLY_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [[ "$APPLY_EVENT" != "workflow_dispatch" ]]; then
            echo "::error::Production infrastructure apply must be started manually with workflow_dispatch."
            exit 1
          fi
          if [[ "$APPLY_REF" != "refs/heads/master" ]]; then
            echo "::error::Production infrastructure apply must target the exact master branch."
            exit 1
          fi
          if [[ "$APPLY_ACTOR" != "JohnClem" ]]; then
            echo "::error::Production infrastructure apply is restricted to the founder account."
            exit 1
          fi
          if [[ "$APPLY_TRIGGERING_ACTOR" != "JohnClem" ]]; then
            echo "::error::Production infrastructure apply reruns are restricted to the founder account."
            exit 1
          fi

  apply:
    name: Terraform Apply
    needs: authorize-production
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/master' &&
        github.actor == 'JohnClem' &&
        github.triggering_actor == 'JohnClem' &&
        needs.authorize-production.result == 'success'
      }}
    runs-on: [self-hosted, Linux, ARM64, cosmaneura-production-local, "cosmaneura-production-local-${{ github.run_id }}"]
    timeout-minutes: 30
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      # Activation is source-reviewed. Keep this identical to
      # infra_production_plan_local.yml; a protected environment variable cannot
      # pre-arm the cutover.
      DURABLE_WEBHOOK_INBOX_ENABLED: "false"
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Reject unreviewed durable webhook activation
        env:
          PROTECTED_DURABLE_WEBHOOK_INBOX_ENABLED: ${{ vars.DURABLE_WEBHOOK_INBOX_ENABLED }}
        run: |
          if [[ -n "${PROTECTED_DURABLE_WEBHOOK_INBOX_ENABLED:-}" && \
                "$PROTECTED_DURABLE_WEBHOOK_INBOX_ENABLED" != "false" ]]; then
            echo "::error::DURABLE_WEBHOOK_INBOX_ENABLED is source-locked false; activation requires a reviewed workflow change."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact-current-master production plan evidence
        id: plan_evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_PLAN_ARTIFACT_DIGEST: ${{ inputs.production_plan_artifact_digest }}
          PRODUCTION_PLAN_RUN_ID: ${{ inputs.production_plan_run_id }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$PRODUCTION_PLAN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "The production plan run ID must be numeric." >&2
            exit 1
          fi
          if [[ ! "$PRODUCTION_PLAN_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The production plan artifact digest must be a SHA-256 digest." >&2
            exit 1
          fi

          current_master_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/master" \
            --jq '.object.sha')
          if [[ "$current_master_sha" != "$TARGET_SHA" ]]; then
            echo "This apply is not running from the current master commit." >&2
            exit 1
          fi

          mapfile -t plan_run < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCTION_PLAN_RUN_ID" \
              --jq '[.name, .path, .event, .status, .conclusion, .head_branch, .head_sha, .run_attempt] | .[]'
          )
          if [[ "${plan_run[0]:-}" != "Terraform Production Plan" || \
                "${plan_run[1]:-}" != ".github/workflows/infra_production_plan_local.yml" || \
                "${plan_run[2]:-}" != "workflow_dispatch" || \
                "${plan_run[3]:-}" != "completed" || \
                "${plan_run[4]:-}" != "success" || \
                "${plan_run[5]:-}" != "master" || \
                "${plan_run[6]:-}" != "$TARGET_SHA" || \
                ! "${plan_run[7]:-}" =~ ^[0-9]+$ ]]; then
            echo "The supplied run is not a successful protected production plan for the exact current master commit." >&2
            exit 1
          fi

          artifact_name="terraform-production-plan-attestation-${PRODUCTION_PLAN_RUN_ID}-${plan_run[7]}-${TARGET_SHA}"
          artifacts=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCTION_PLAN_RUN_ID/artifacts?per_page=100")
          artifact_count=$(jq -r --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | length' \
            <<<"$artifacts")
          if [[ "$artifact_count" != "1" ]]; then
            echo "The production plan run must contain exactly one live attestation artifact with the expected name." >&2
            exit 1
          fi
          artifact_digest=$(jq -er --arg name "$artifact_name" \
            '.artifacts[] | select(.name == $name and .expired == false) | .digest' \
            <<<"$artifacts")
          if [[ "$artifact_digest" != "$PRODUCTION_PLAN_ARTIFACT_DIGEST" ]]; then
            echo "The protected attestation artifact digest does not match the reviewed digest." >&2
            exit 1
          fi
          {
            echo "artifact_name=$artifact_name"
            echo "artifact_digest=$PRODUCTION_PLAN_ARTIFACT_DIGEST"
            echo "run_id=$PRODUCTION_PLAN_RUN_ID"
            echo "run_attempt=${plan_run[7]}"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact immutable reviewed-plan attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.plan_evidence.outputs.artifact_name }}
          path: infra/reviewed-attestation
          github-token: ${{ github.token }}
          run-id: ${{ inputs.production_plan_run_id }}

      - name: Validate attestation identity and shape
        working-directory: infra
        env:
          ARTIFACT_NAME: ${{ steps.plan_evidence.outputs.artifact_name }}
          PRODUCTION_PLAN_RUN_ID: ${{ inputs.production_plan_run_id }}
          PRODUCTION_PLAN_RUN_ATTEMPT: ${{ steps.plan_evidence.outputs.run_attempt }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          metadata=reviewed-attestation/plan-attestation.json
          if [[ ! -f "$metadata" || -L "$metadata" ]]; then
            echo "The reviewed plan attestation is missing or unsafe." >&2
            exit 1
          fi
          if [[ "$(find reviewed-attestation -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" != "1" ]]; then
            echo "The reviewed plan artifact contains unexpected files." >&2
            exit 1
          fi
          jq -e \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg head_sha "$TARGET_SHA" \
            --arg run_attempt "$PRODUCTION_PLAN_RUN_ATTEMPT" \
            --arg run_id "$PRODUCTION_PLAN_RUN_ID" \
            '(.schema_version == 1) and
             (.workflow_name == "Terraform Production Plan") and
             (.workflow_path == ".github/workflows/infra_production_plan_local.yml") and
             (.artifact_name == $artifact_name) and
             (.run_id == $run_id) and
             (.run_attempt == $run_attempt) and
             (.head_branch == "master") and
             (.head_sha == $head_sha) and
             (.canonical_plan_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
             (.configuration_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
             (.provider_lock_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
             (.state_lineage | type == "string" and length > 0) and
             (.state_serial | type == "number" and . >= 0)' \
            "$metadata" >/dev/null

      # main.tf data sources shell out to `just direnv_export`; the
      # common-setup action installs mise + just + direnv + 1Password CLI.
      - uses: ./.github/actions/common-setup
        timeout-minutes: 5
        with:
          apt-packages: zsh

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve exact production Container Apps egress
        run: |
          set -euo pipefail
          outbound_addresses=$(az containerapp show \
            --resource-group cosmaneura-prod \
            --name cosmaneura-prod-scheduler \
            --query properties.outboundIpAddresses \
            --output json \
            --only-show-errors)
          production_egress=$(jq -er '
            select(type == "array" and length == 1) |
            .[0] |
            select(type == "string" and test("^([0-9]{1,3}\\.){3}[0-9]{1,3}$"))
          ' <<<"$outbound_addresses") || {
            echo "::error::Production scheduler must expose exactly one valid outbound IPv4 address."
            exit 1
          }
          echo "TF_VAR_production_container_apps_egress_ipv4=$production_egress" >> "$GITHUB_ENV"

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: tofu init
        working-directory: infra
        run: tofu init -input=false -lockfile=readonly

      - name: Recreate and verify exact reviewed plan
        working-directory: infra
        env:
          # Limit long-lived credentials to the one step that must resolve the
          # production configuration. They are absent from setup and apply.
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PRODUCTION_SERVICE_ACCOUNT_TOKEN }}
          RECALL_WEBHOOK_SECRET: ${{ secrets.RECALL_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          metadata=reviewed-attestation/plan-attestation.json

          configuration_sha256=$(
            git -C .. ls-files -z -- \
              infra .env .env.production.backend .env.production.frontend .envrc .tool-versions \
              Justfile just Procfile .github/actions \
              .github/workflows/infra_production_plan_local.yml \
              .github/workflows/infra_apply_local.yml \
              .github/workflows/build_and_publish.yml \
              .github/workflows/build_and_publish_local.yml \
              .github/workflows/infra_production_plan.yml .github/workflows/infra_apply.yml \
              .github/workflows/build_and_publish_manual.yml .env.shared docker-compose.yml \
              scripts/local_release_runner.py scripts/local_ci_services.py scripts/local-runner |
              LC_ALL=C sort -z |
              xargs -0 -I{} sha256sum "../{}" |
              sha256sum |
              awk '{print $1}'
          )
          provider_lock_sha256=$(sha256sum .terraform.lock.hcl | awk '{print $1}')
          state_identity=$(tofu state pull | jq -cS '{lineage, serial}')
          state_lineage=$(jq -er '.lineage | select(type == "string" and length > 0)' <<<"$state_identity")
          state_serial=$(jq -er '.serial | select(type == "number" and . >= 0)' <<<"$state_identity")

          [[ "$configuration_sha256" == "$(jq -er '.configuration_sha256' "$metadata")" ]] || {
            echo "Production configuration changed after the reviewed plan." >&2
            exit 1
          }
          [[ "$provider_lock_sha256" == "$(jq -er '.provider_lock_sha256' "$metadata")" ]] || {
            echo "The provider dependency lock changed after the reviewed plan." >&2
            exit 1
          }
          [[ "$state_lineage" == "$(jq -er '.state_lineage' "$metadata")" ]] || {
            echo "The production state lineage does not match the reviewed plan." >&2
            exit 1
          }
          [[ "$state_serial" == "$(jq -er '.state_serial' "$metadata")" ]] || {
            echo "The production state advanced after the reviewed plan." >&2
            exit 1
          }

          tofu plan -no-color -input=false -out=tfplan.bin
          # Keep this normalization identical to the protected plan workflow.
          # OpenTofu does not guarantee relevant_attributes array order.
          canonical_plan_sha256=$(tofu show -json tfplan.bin |
            jq -cS 'del(.timestamp) | .relevant_attributes |= ((. // []) | sort_by(.resource, .attribute))' |
            sha256sum |
            awk '{print $1}')
          if [[ "$canonical_plan_sha256" != "$(jq -er '.canonical_plan_sha256' "$metadata")" ]]; then
            echo "The freshly saved plan does not exactly match the reviewed canonical plan." >&2
            exit 1
          fi
          echo "Verified canonical reviewed-plan SHA-256: \`$canonical_plan_sha256\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Reverify current master and apply
        working-directory: infra
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_master_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/master" \
            --jq '.object.sha')
          if [[ "$current_master_sha" != "$TARGET_SHA" ]]; then
            echo "Master advanced after verification; refusing to apply a stale commit." >&2
            exit 1
          fi
          tofu apply -input=false -auto-approve tfplan.bin

      - name: Summarize apply
        if: always()
        working-directory: infra
        env:
          APPLY_COMMIT: ${{ github.sha }}
          APPLY_JOB_STATUS: ${{ job.status }}
          ATTESTATION_DIGEST: ${{ steps.plan_evidence.outputs.artifact_digest }}
          REVIEWED_PLAN_RUN_ID: ${{ steps.plan_evidence.outputs.run_id }}
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          {
            printf '%s\n' "## Terraform Apply"
            printf '%s\n' ''
            printf '%s\n' "Job status: $APPLY_JOB_STATUS"
            printf '%s\n' "Commit: $APPLY_COMMIT"
            printf '%s\n' "Reviewed plan run: $REVIEWED_PLAN_RUN_ID"
            printf '%s\n' "Attestation digest: $ATTESTATION_DIGEST"
            printf '%s\n' "Triggered by: $TRIGGER_EVENT on $TRIGGER_REF"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove sensitive local plan material
        if: always()
        run: rm -rf infra/tfplan.bin infra/reviewed-attestation
