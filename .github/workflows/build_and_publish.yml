name: Build & Publish

on:
  workflow_dispatch:
    # allow ssh access to be enabled via the GH actions UI
    inputs:
      debug_enabled:
        type: boolean
        description: "Run with tmate enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: false
  push:
    branches: [master, staging]
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # run `just secrets_ci_grant-github-actions` to set
  OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_CLERK_PUBLIC_KEY: ${{ secrets.VITE_CLERK_PUBLIC_KEY || secrets.CLERK_PUBLISHABLE_KEY }}
  VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY || secrets.POSTHOG_KEY }}
  VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST || secrets.POSTHOG_HOST }}
  CLERK_PRIVATE_KEY: ${{ secrets.CLERK_PRIVATE_KEY }}

  # for the gh-cli
  GH_TOKEN: ${{ github.token }}

  # required otherwise github api calls are rate limited
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # a important design goal is to avoid custom configuration in CI. This enables tests to be run in a CI-like environment
  # locally, making it easy to replicate CI issues. This is one of the few CI-specific configuration changes since
  # the host where services are located is truly unique to the CI environment.
  DATABASE_HOST: localhost
  REDIS_HOST: localhost
  SMTP_HOST: localhost

  # https://github.com/Textualize/rich/issues/2769
  COLUMNS: 120

jobs:
  # NOTE there is no global timeout minutes, so we need to set it on each job :/

  app:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        timeout-minutes: 5
      - uses: iloveitaly/github-action-localias@master
        with:
          chrome: true
      - run: just up --fast
      - run: just py_setup
      - run: just py_lint
        # TODO temporarily disable, it's hard to get typing right...
        continue-on-error: true

      - run: just db_migrate
      - run: just db_lint
        # TODO temporarily disable, need to whitelist existing errors...
        continue-on-error: true

      - name: Log service routing (diagnostics)
        run: |
          echo "CI Service Routing Diagnostics:"
          echo "Azure OpenAI Endpoint: ${AZURE_OPENAI_ENDPOINT}"
          echo "Container Registry: ${CONTAINER_REGISTRY_HOST}"
          echo "Storage Account: ${AZURE_UPLOADS_ACCOUNT_NAME}"
          # Log hostnames/resource names

      - run: just py_test

      # NOTE one important problem with `detached` is if something fails, the github environment does seem to get wiped
      # for instance GITHUB_ENV, seems to be cleared out.
      - uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
        with: { detached: true }

      - name: Upload test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          # playwright traces, screenshots, logs, etc
          # traces and pngs allow us to debug e2e test failures
          name: test-results
          # NOTE if direnv sourcing fails, this var will not be set and it will fail
          path: |
            ${{ env.TEST_RESULTS_DIRECTORY }}
            ${{ env.PLAYWRIGHT_VISUAL_SNAPSHOT_DIRECTORY }}

  web:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        timeout-minutes: 5
      - run: just js_setup
      - run: just js_lint
      - run: just js_test

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web, app]
    if: ${{ github.ref == 'refs/heads/master' && github.event_name == 'push' }}
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      CONTAINER_REGISTRY_HOST: ${{ vars.CONTAINER_REGISTRY_HOST || secrets.CONTAINER_REGISTRY_HOST }}
      CONTAINER_REGISTRY_USERNAME: ${{ vars.CONTAINER_REGISTRY_USERNAME || secrets.CONTAINER_REGISTRY_USERNAME }}
      VITE_CLERK_PUBLIC_KEY: ${{ secrets.VITE_CLERK_PUBLIC_KEY || secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_PRIVATE_KEY: ${{ secrets.CLERK_PRIVATE_KEY }}
    permissions:
      contents: read
      # TODO why exactly do we need id-token here?
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        timeout-minutes: 5

      # TODO I think we can use the magic azure credentials for this, need to swap out password with those credentials
      # login before building so previous build image can be pulled for nixpacks cache
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY_HOST }}
          username: ${{ env.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
      - run: just build
      - run: just build_push

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure
        run: |
          cd infra && bash deploy.sh ${{ github.sha }}

  deploy-staging:
    name: 🚀 Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [web, app]
    if: ${{ github.ref == 'refs/heads/staging' && github.event_name == 'push' }}
    environment: staging
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      CONTAINER_REGISTRY_HOST: ${{ vars.CONTAINER_REGISTRY_HOST || secrets.CONTAINER_REGISTRY_HOST }}
      CONTAINER_REGISTRY_USERNAME: ${{ vars.CONTAINER_REGISTRY_USERNAME || secrets.CONTAINER_REGISTRY_USERNAME }}
      VITE_CLERK_PUBLIC_KEY: ${{ secrets.VITE_CLERK_PUBLIC_KEY || secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_PRIVATE_KEY: ${{ secrets.CLERK_PRIVATE_KEY }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/common-setup
        timeout-minutes: 5

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY_HOST }}
          username: ${{ env.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
      - run: just build
      - run: just build_push

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Staging
        run: |
          cd infra-staging && bash deploy.sh ${{ github.sha }}
