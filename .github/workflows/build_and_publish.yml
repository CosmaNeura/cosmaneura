name: Build & Publish (retired legacy path)

# This path is intentionally retained so workflow ID 132737823 and its history
# remain auditable. The active workflow lives at
# .github/workflows/build_and_publish_manual.yml. The GitHub registration for
# this legacy path is disabled after the replacement is registered.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Legacy workflow is retired
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Refuse execution
        run: |
          echo "::error::This legacy workflow path is retired. Use Build & Publish (manual)."
          exit 1
