name: Terraform Plan

# Pull requests get format, validation, and a provider-mocked static plan only.
# This workflow is intentionally credential-free. The protected production
# plan lives in infra_production_plan.yml, which has no pull-request trigger.
on:
  pull_request:
    paths:
      - 'infra/**'
      - 'infra-staging-rehearsal/**'
      - 'infra-staging-sanitizer-bootstrap-identity/**'
      - 'scripts/check_staging_job_identity_schema.py'
      - '.env'
      - '.env.production.backend'
      - '.env.production.frontend'
      - '.github/workflows/infra_*.yml'
      - 'Procfile'

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-static-plan:
    name: Terraform PR checks (secretless)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: tofu init without backend
        working-directory: infra
        run: tofu init -backend=false -input=false

      - name: tofu fmt -check
        working-directory: infra
        run: tofu fmt -check -diff -recursive

      - name: tofu validate
        working-directory: infra
        run: tofu validate

      - name: tofu plan (mock providers, no backend)
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          tofu test -test-directory=tests -no-color 2>&1 | tee pr-plan.txt
          {
            echo "## Terraform PR checks"
            echo ''
            echo 'Formatting, validation, and the secretless provider-mocked plan passed.'
            echo 'This does not read or diff production state.'
            echo ''
            echo '```'
            head -c 60000 pr-plan.txt
            if [ "$(wc -c < pr-plan.txt)" -gt 60000 ]; then
              echo ''
              echo '...[truncated, see full step log]'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  staging-rehearsal-static-plan:
    name: Staging rehearsal Terraform PR checks (secretless)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: tofu init without backend
        working-directory: infra-staging-rehearsal
        run: |
          set -euo pipefail
          tofu init -backend=false -input=false -lockfile=readonly
          git diff --exit-code -- .terraform.lock.hcl

      - name: tofu fmt -check
        working-directory: infra-staging-rehearsal
        run: tofu fmt -check -diff -recursive

      - name: tofu validate
        working-directory: infra-staging-rehearsal
        run: tofu validate -no-color

      - name: Validate pull-only Job identity schema without Azure
        run: python3 scripts/check_staging_job_identity_schema.py

      - name: tofu plan (mock providers, no backend)
        working-directory: infra-staging-rehearsal
        run: tofu test -test-directory=tests -no-color

  staging-sanitizer-bootstrap-identity-static-plan:
    name: Staging sanitizer bootstrap identity Terraform checks (secretless)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: tofu init without backend
        working-directory: infra-staging-sanitizer-bootstrap-identity
        run: tofu init -backend=false -input=false

      - name: tofu fmt -check
        working-directory: infra-staging-sanitizer-bootstrap-identity
        run: tofu fmt -check -diff -recursive

      - name: tofu validate
        working-directory: infra-staging-sanitizer-bootstrap-identity
        run: tofu validate -no-color

      - name: tofu plan (mock provider, no backend)
        working-directory: infra-staging-sanitizer-bootstrap-identity
        run: tofu test -test-directory=tests -no-color
