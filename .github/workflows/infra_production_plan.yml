name: Terraform Production Plan

# This workflow is deliberately separate from the pull-request plan. It reads
# production state and credentials only after the founder starts it on
# master and the protected production environment admits the job. The saved
# plan never leaves the ephemeral runner: only a nonsecret, immutable digest
# attestation is uploaded for the separately approved apply workflow.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Share the production mutation lock so the attested state cannot race an
  # infrastructure apply or application rollout while the plan is generated.
  group: cosmaneura-production-container-apps
  cancel-in-progress: false

jobs:
  authorize-production:
    name: Authorize production infrastructure plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require founder-authorized manual plan from master
        env:
          PLAN_ACTOR: ${{ github.actor }}
          PLAN_EVENT: ${{ github.event_name }}
          PLAN_REF: ${{ github.ref }}
          PLAN_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          if [[ "$PLAN_EVENT" != "workflow_dispatch" ]]; then
            echo "::error::Production infrastructure planning must be started manually with workflow_dispatch."
            exit 1
          fi
          if [[ "$PLAN_REF" != "refs/heads/master" ]]; then
            echo "::error::Production infrastructure planning must target the exact master branch."
            exit 1
          fi
          if [[ "$PLAN_ACTOR" != "JohnClem" ]]; then
            echo "::error::Production infrastructure planning is restricted to the founder account."
            exit 1
          fi
          if [[ "$PLAN_TRIGGERING_ACTOR" != "JohnClem" ]]; then
            echo "::error::Production infrastructure plan reruns are restricted to the founder account."
            exit 1
          fi

  plan:
    name: Terraform production plan
    needs: authorize-production
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/master' &&
        github.actor == 'JohnClem' &&
        github.triggering_actor == 'JohnClem' &&
        needs.authorize-production.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      DURABLE_WEBHOOK_INBOX_ENABLED: "false"
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Reject unreviewed durable webhook activation
        env:
          PROTECTED_DURABLE_WEBHOOK_INBOX_ENABLED: ${{ vars.DURABLE_WEBHOOK_INBOX_ENABLED }}
        run: |
          if [[ -n "${PROTECTED_DURABLE_WEBHOOK_INBOX_ENABLED:-}" && \
                "$PROTECTED_DURABLE_WEBHOOK_INBOX_ENABLED" != "false" ]]; then
            echo "::error::DURABLE_WEBHOOK_INBOX_ENABLED is source-locked false; activation requires a reviewed workflow change."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify this run targets current master
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          current_master_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/master" \
            --jq '.object.sha')
          if [[ "$current_master_sha" != "$TARGET_SHA" ]]; then
            echo "This plan is not running from the current master commit." >&2
            exit 1
          fi

      - uses: ./.github/actions/common-setup
        timeout-minutes: 5
        with:
          apt-packages: zsh

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve exact production Container Apps egress
        run: |
          set -euo pipefail
          outbound_addresses=$(az containerapp show \
            --resource-group cosmaneura-prod \
            --name cosmaneura-prod-scheduler \
            --query properties.outboundIpAddresses \
            --output json \
            --only-show-errors)
          production_egress=$(jq -er '
            select(type == "array" and length == 1) |
            .[0] |
            select(type == "string" and test("^([0-9]{1,3}\\.){3}[0-9]{1,3}$"))
          ' <<<"$outbound_addresses") || {
            echo "::error::Production scheduler must expose exactly one valid outbound IPv4 address."
            exit 1
          }
          echo "TF_VAR_production_container_apps_egress_ipv4=$production_egress" >> "$GITHUB_ENV"

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.5
          tofu_wrapper: false

      - name: tofu init
        working-directory: infra
        run: tofu init -input=false -lockfile=readonly

      - name: tofu fmt -check against production configuration
        working-directory: infra
        run: tofu fmt -check -diff -recursive

      - name: tofu validate against production configuration
        working-directory: infra
        run: tofu validate

      - name: tofu plan against protected production state
        working-directory: infra
        env:
          # These long-lived credentials exist only while OpenTofu resolves
          # the reviewed production configuration into its ephemeral plan.
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PRODUCTION_SERVICE_ACCOUNT_TOKEN }}
          RECALL_WEBHOOK_SECRET: ${{ secrets.RECALL_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          tofu plan -no-color -input=false -detailed-exitcode -out=tfplan.bin 2>&1 | tee plan.txt || plan_exit=$?
          plan_exit=${plan_exit:-0}
          {
            echo "## Protected Terraform Plan"
            echo ''
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo ''
            echo '```'
            head -c 60000 plan.txt
            if [ "$(wc -c < plan.txt)" -gt 60000 ]; then
              echo ''
              echo '...[truncated, see full plan in step log]'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$plan_exit" in
            0 | 2) ;;
            *)
              echo "OpenTofu plan returned an unexpected exit status." >&2
              exit 1
              ;;
          esac

      - name: Create nonsecret reviewed-plan attestation
        working-directory: infra
        env:
          ARTIFACT_NAME: terraform-production-plan-attestation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077

          # OpenTofu emits this set-like metadata array in nondeterministic
          # order. Sort only that array; every substantive plan field remains.
          canonical_plan_sha256=$(tofu show -json tfplan.bin |
            jq -cS 'del(.timestamp) | .relevant_attributes |= ((. // []) | sort_by(.resource, .attribute))' |
            sha256sum |
            awk '{print $1}')
          configuration_sha256=$(
            git -C .. ls-files -z -- \
              infra .env .env.production.backend .env.production.frontend .envrc .tool-versions \
              Justfile just Procfile .github/actions \
              .github/workflows/infra_production_plan.yml \
              .github/workflows/infra_apply.yml \
              .github/workflows/build_and_publish.yml \
              .github/workflows/build_and_publish_manual.yml |
              LC_ALL=C sort -z |
              xargs -0 -I{} sha256sum "../{}" |
              sha256sum |
              awk '{print $1}'
          )
          provider_lock_sha256=$(sha256sum .terraform.lock.hcl | awk '{print $1}')
          state_identity=$(tofu state pull | jq -cS '{lineage, serial}')
          state_lineage=$(jq -er '.lineage | select(type == "string" and length > 0)' <<<"$state_identity")
          state_serial=$(jq -er '.serial | select(type == "number" and . >= 0)' <<<"$state_identity")

          jq -n \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg canonical_plan_sha256 "$canonical_plan_sha256" \
            --arg configuration_sha256 "$configuration_sha256" \
            --arg head_branch "master" \
            --arg head_sha "$GITHUB_SHA" \
            --arg provider_lock_sha256 "$provider_lock_sha256" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg state_lineage "$state_lineage" \
            --argjson state_serial "$state_serial" \
            '{
              schema_version: 1,
              workflow_name: "Terraform Production Plan",
              workflow_path: ".github/workflows/infra_production_plan.yml",
              artifact_name: $artifact_name,
              run_id: $run_id,
              run_attempt: $run_attempt,
              head_branch: $head_branch,
              head_sha: $head_sha,
              canonical_plan_sha256: $canonical_plan_sha256,
              configuration_sha256: $configuration_sha256,
              provider_lock_sha256: $provider_lock_sha256,
              state_lineage: $state_lineage,
              state_serial: $state_serial
            }' > plan-attestation.json

          {
            echo ''
            echo "Canonical reviewed-plan SHA-256: \`$canonical_plan_sha256\`"
            echo "Attestation artifact: \`$ARTIFACT_NAME\`"
            echo ''
            echo "Only hashes and state identity metadata are uploaded; tfplan.bin is deleted before upload."
          } >> "$GITHUB_STEP_SUMMARY"
          # Remove the sensitive plan before even the pinned artifact action
          # runs, so that action can access only the nonsecret attestation.
          rm -f tfplan.bin plan.txt

      - name: Upload immutable reviewed-plan attestation
        id: upload_attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-production-plan-attestation-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: infra/plan-attestation.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Record immutable attestation digest
        id: record_attestation_digest
        env:
          ARTIFACT_DIGEST: ${{ steps.upload_attestation.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          artifact_digest="${ARTIFACT_DIGEST#sha256:}"
          if [[ ! "$artifact_digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "The artifact service did not return a valid SHA-256 digest." >&2
            exit 1
          fi
          normalized_artifact_digest="sha256:$artifact_digest"
          echo "artifact_digest=$normalized_artifact_digest" >> "$GITHUB_OUTPUT"
          echo "Artifact service digest: \`$normalized_artifact_digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove sensitive local plan material
        if: always()
        run: rm -f infra/tfplan.bin infra/plan.txt infra/plan-attestation.json
