# Non-production proof: a synthetic deep-layer image fails to pull under
# classic overlay2 and pulls+probes after enabling the containerd image store.
# Two jobs on fresh runners avoid flipping the daemon twice on one machine.
# No secrets, Azure, or production environment.
name: Deep-layer pull proof
on:
  pull_request:
    paths:
      - .github/workflows/deep_layer_pull_proof.yml
      - .github/workflows/run_production_checks.yml
      - ops/production-checks/**
      - docs/production-hosted-checks.md
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  refuse-on-overlay2:
    name: Overlay2 refuses deep-layer pull
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build deep image under containerd, then refuse pull on overlay2
        run: |
          printf '%s\n' '{"features":{"containerd-snapshotter":true}}' \
            | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          mkdir -p "$RUNNER_TEMP/registry-data"
          docker run -d --name deep-layer-registry -p 5000:5000 \
            -v "$RUNNER_TEMP/registry-data:/var/lib/registry" registry:2
          work="$(mktemp -d)"
          {
            echo 'FROM python:3.13-slim'
            i=0
            while [ "$i" -lt 130 ]; do
              printf 'COPY layer-%s.txt /layers/%s.txt\n' "$i" "$i"
              printf 'synthetic-layer-%s\n' "$i" >"$work/layer-$i.txt"
              i=$((i + 1))
            done
            echo 'CMD ["python", "-c", "print(\"RUNTIME_SUPPORTED=1\")"]'
          } >"$work/Dockerfile"
          docker build -t localhost:5000/deep-layer-proof:synthetic "$work"
          history_lines="$(docker history --format '{{.ID}}' localhost:5000/deep-layer-proof:synthetic | wc -l)"
          test "$history_lines" -gt 125
          docker push localhost:5000/deep-layer-proof:synthetic
          docker rmi localhost:5000/deep-layer-proof:synthetic
          printf '%s\n' '{"features":{"containerd-snapshotter":false}}' \
            | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          docker run -d --name deep-layer-registry -p 5000:5000 \
            -v "$RUNNER_TEMP/registry-data:/var/lib/registry" registry:2
          set +e
          out="$(docker pull localhost:5000/deep-layer-proof:synthetic 2>&1)"
          code=$?
          set -e
          test "$code" -ne 0
          printf '%s\n' "$out" | grep -F 'max depth exceeded' >/dev/null

  pull-on-containerd:
    name: Containerd pulls and probes deep-layer image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pull and probe deep image with containerd image store
        run: |
          printf '%s\n' '{"features":{"containerd-snapshotter":true}}' \
            | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          mkdir -p "$RUNNER_TEMP/registry-data"
          docker run -d --name deep-layer-registry -p 5000:5000 \
            -v "$RUNNER_TEMP/registry-data:/var/lib/registry" registry:2
          work="$(mktemp -d)"
          {
            echo 'FROM python:3.13-slim'
            i=0
            while [ "$i" -lt 130 ]; do
              printf 'COPY layer-%s.txt /layers/%s.txt\n' "$i" "$i"
              printf 'synthetic-layer-%s\n' "$i" >"$work/layer-$i.txt"
              i=$((i + 1))
            done
            echo 'CMD ["python", "-c", "print(\"RUNTIME_SUPPORTED=1\")"]'
          } >"$work/Dockerfile"
          docker build -t localhost:5000/deep-layer-proof:synthetic "$work"
          history_lines="$(docker history --format '{{.ID}}' localhost:5000/deep-layer-proof:synthetic | wc -l)"
          test "$history_lines" -gt 125
          docker push localhost:5000/deep-layer-proof:synthetic
          docker rmi localhost:5000/deep-layer-proof:synthetic
          docker pull localhost:5000/deep-layer-proof:synthetic
          out="$(docker run --rm --pull=never --network=none localhost:5000/deep-layer-proof:synthetic)"
          test "$out" = 'RUNTIME_SUPPORTED=1'
