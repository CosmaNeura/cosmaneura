name: Release verified candidate

# Reusable production promotion for a staging-verified master SHA. Supersedes the
# one-time 27 Oct Release verified production pin for current master without
# weakening founder, Apply, callback, digest, or environment gates.
on:
  workflow_dispatch:
    inputs:
      github_hosted_fallback_authorized:
        type: boolean
        description: "Authorize the hosted build and deployment"
        required: true
        default: false
      candidate_sha:
        type: string
        description: "Exact master SHA that already passed Deploy Staging Candidate"
        required: true
      staging_run_id:
        type: string
        description: "Successful Deploy Staging Candidate run for the candidate SHA"
        required: true
      staging_image_digest:
        type: string
        description: "Immutable staging image digest observed for that run (sha256:<64 hex>)"
        required: true
      terraform_apply_run_id:
        type: string
        description: "Successful applicable production Terraform Apply run"
        required: true
      provider_signed_recall_callback_verified:
        type: boolean
        description: "Attest that the real signed synthetic Recall callback passed before release"
        required: true
        default: false

concurrency:
  group: Build & Publish-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COLUMNS: 120
jobs:
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: cosmaneura-production-container-apps
      cancel-in-progress: false
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/master' &&
        github.actor == 'JohnClem' &&
        github.triggering_actor == 'JohnClem' &&
        inputs.github_hosted_fallback_authorized
      }}
    environment: production
    env:
      DURABLE_WEBHOOK_INBOX_ENABLED: "false"
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Reject unreviewed durable webhook activation
        env:
          PROTECTED_DURABLE_WEBHOOK_INBOX_ENABLED: ${{ vars.DURABLE_WEBHOOK_INBOX_ENABLED }}
        run: |
          if [[ -n "${PROTECTED_DURABLE_WEBHOOK_INBOX_ENABLED:-}" && \
                "$PROTECTED_DURABLE_WEBHOOK_INBOX_ENABLED" != "false" ]]; then
            echo "::error::DURABLE_WEBHOOK_INBOX_ENABLED is source-locked false; activation requires a reviewed workflow change."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.candidate_sha }}

      - name: Verify staging-verified candidate before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          STAGING_IMAGE_DIGEST: ${{ inputs.staging_image_digest }}
        run: python3 scripts/verify_release_verified_candidate.py

      - name: Require provider-signed callback gate for manual production deploy
        if: github.event_name == 'workflow_dispatch'
        env:
          PROVIDER_CALLBACK_VERIFIED: ${{ inputs.provider_signed_recall_callback_verified }}
        run: |
          if [[ "$PROVIDER_CALLBACK_VERIFIED" != "true" ]]; then
            echo "A real provider-signed non-PHI Recall callback must pass before production deploy." >&2
            exit 1
          fi

      - name: Verify successful applicable Terraform Apply
        env:
          GH_TOKEN: ${{ github.token }}
          TERRAFORM_APPLY_RUN_ID: ${{ inputs.terraform_apply_run_id }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$TERRAFORM_APPLY_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "No successful Terraform Apply is available for this production deploy." >&2
            exit 1
          fi
          mapfile -t apply_run < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TERRAFORM_APPLY_RUN_ID" \
              --jq '[.name, .path, .conclusion, .event, .head_branch, .head_sha] | .[]'
          )
          if [[ "${apply_run[0]:-}" != "Terraform Apply" || \
                "${apply_run[1]:-}" != ".github/workflows/infra_apply_local.yml" || \
                "${apply_run[2]:-}" != "success" || \
                "${apply_run[4]:-}" != "master" ]]; then
            echo "The supplied run is not a successful Terraform Apply on master." >&2
            exit 1
          fi
          if [[ "${apply_run[3]:-}" != "workflow_dispatch" ]]; then
            echo "The supplied Terraform Apply run has an invalid trigger." >&2
            exit 1
          fi
          apply_sha="${apply_run[5]:-}"
          if [[ -z "$apply_sha" ]] || \
             ! git merge-base --is-ancestor "$apply_sha" "$TARGET_SHA"; then
            echo "The supplied Terraform Apply commit is not an ancestor of this deploy." >&2
            exit 1
          fi
          if ! git diff --quiet "$apply_sha" "$TARGET_SHA" -- \
            infra .env .env.production.backend .env.production.frontend .envrc .tool-versions \
            Justfile just Procfile .github/actions \
            .github/workflows/infra_apply_local.yml \
            .github/workflows/infra_production_plan_local.yml \
            .github/workflows/build_and_publish.yml \
            .github/workflows/build_and_publish_local.yml \
            .github/workflows/release_verified_candidate.yml \
            .github/workflows/infra_production_plan.yml .github/workflows/infra_apply.yml \
            .github/workflows/build_and_publish_manual.yml .env.shared docker-compose.yml \
            scripts/local_release_runner.py scripts/local_ci_services.py scripts/local-runner \
            scripts/production_core_candidate.py scripts/production_core_runtime_binding.py \
            scripts/verify_release_verified_candidate.py \
            scripts/session_prep_production_frontend_admission.py \
            scripts/superadmin_capability_config_preflight.py; then
            echo "Production infrastructure changed after the supplied Terraform Apply." >&2
            exit 1
          fi

      - uses: ./.github/actions/common-setup
        timeout-minutes: 10
        with:
          apt-packages: zsh

      - uses: ./.github/actions/install-nixpacks

      - name: Resolve production frontend build configuration
        env:
          FRONTEND_ENV_SOURCE: .env.production.frontend
          JAVASCRIPT_BUILD_ENV_JSON: ${{ runner.temp }}/production-frontend-build.json
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PRODUCTION_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          just direnv_export "$FRONTEND_ENV_SOURCE" |
            jq -ce '{
              NODE_ENV,
              OPENAPI_JSON_PATH,
              VITE_CLERK_PUBLIC_KEY,
              VITE_INTAKE_CHAT_DOMAIN,
              VITE_POSTHOG_HOST,
              VITE_POSTHOG_KEY,
              VITE_PYTHON_URL,
              VITE_SENTRY_DSN,
              VITE_SOVEREIGN_PLATFORM_AUTHORITY_ENABLED: "false",
              VITE_SOVEREIGN_PROVIDER_URL
            } | if all(.[]; type == "string" and length > 0 and (contains("\u0000") | not)) and (.VITE_SOVEREIGN_PLATFORM_AUTHORITY_ENABLED == "true" or .VITE_SOVEREIGN_PLATFORM_AUTHORITY_ENABLED == "false") then . else error("frontend build configuration is incomplete") end' \
            > "$JAVASCRIPT_BUILD_ENV_JSON"
          chmod 0600 "$JAVASCRIPT_BUILD_ENV_JSON"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ vars.CONTAINER_REGISTRY_HOST || secrets.CONTAINER_REGISTRY_HOST }}
          username: ${{ vars.CONTAINER_REGISTRY_USERNAME || secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build production images from resolved public configuration
        run: just build
        env:
          CONTAINER_REGISTRY_HOST: ${{ vars.CONTAINER_REGISTRY_HOST || secrets.CONTAINER_REGISTRY_HOST }}
          JAVASCRIPT_BUILD_ENV_JSON: ${{ runner.temp }}/production-frontend-build.json
          PYTHON_ENV: production

      - name: Scan the built production image with Trivy before publish
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          # aquasec/trivy:0.58.1 multi-arch index digest observed 2026-11-19
          TRIVY_IMAGE: aquasec/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
        run: |
          set -euo pipefail
          image="cosmaneura:${CANDIDATE_SHA}"
          docker image inspect "$image" >/dev/null
          docker pull "$TRIVY_IMAGE"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" \
            image --exit-code 1 --severity-exit-code 1 \
            --severity CRITICAL,HIGH --ignore-unfixed \
            "$image"

      - name: Remove resolved production frontend configuration
        if: always()
        env:
          JAVASCRIPT_BUILD_ENV_JSON: ${{ runner.temp }}/production-frontend-build.json
        run: rm -f -- "$JAVASCRIPT_BUILD_ENV_JSON"

      - name: Reverify current master before publishing production images
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "Release SHA drifted from the staging-verified candidate." >&2
            exit 1
          fi
          current_master_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/master" \
            --jq '.object.sha')
          if [[ "$current_master_sha" != "$TARGET_SHA" ]]; then
            echo "Master advanced during the build; refusing to publish stale images." >&2
            exit 1
          fi

      - run: just build_push
        env:
          CONTAINER_REGISTRY_HOST: ${{ vars.CONTAINER_REGISTRY_HOST || secrets.CONTAINER_REGISTRY_HOST }}
          PYTHON_ENV: production

      - name: Pin the published production image digest
        id: production_digest
        env:
          CONTAINER_REGISTRY_HOST: ${{ vars.CONTAINER_REGISTRY_HOST || secrets.CONTAINER_REGISTRY_HOST }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          # deploy.sh admits only this exact production registry host + digest form.
          registry_host="cosmaneuraprodregistry.azurecr.io"
          if [[ "${CONTAINER_REGISTRY_HOST}" != "$registry_host" ]]; then
            echo "::error::Production registry host drifted from the admitted Core registry."
            exit 1
          fi
          image_ref="${registry_host}/cosmaneura/cosmaneura:${CANDIDATE_SHA}"
          digest=$(docker buildx imagetools inspect "$image_ref" --format '{{.Manifest.Digest}}')
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Published production image did not resolve to an immutable digest."
            exit 1
          fi
          remote=$(docker buildx imagetools inspect \
            "${registry_host}/cosmaneura/cosmaneura@${digest}" \
            --format '{{.Manifest.Digest}}')
          if [[ "$remote" != "$digest" ]]; then
            echo "::error::Registry digest mismatch after publish."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=${registry_host}/cosmaneura/cosmaneura@${digest}" >> "$GITHUB_OUTPUT"
          echo "Pinned production digest ${digest}" >> "$GITHUB_STEP_SUMMARY"

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Reverify current master before production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "Release SHA drifted from the staging-verified candidate." >&2
            exit 1
          fi
          current_master_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/master" \
            --jq '.object.sha')
          if [[ "$current_master_sha" != "$TARGET_SHA" ]]; then
            echo "Master advanced before deployment; refusing to mutate Azure from a stale commit." >&2
            exit 1
          fi
          python3 scripts/production_core_candidate.py context

      - name: Deploy the pinned production digest to Azure
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
          CONTAINER_REGISTRY_HOST: ${{ vars.CONTAINER_REGISTRY_HOST || secrets.CONTAINER_REGISTRY_HOST }}
          CONTAINER_REGISTRY_USERNAME: ${{ vars.CONTAINER_REGISTRY_USERNAME || secrets.CONTAINER_REGISTRY_USERNAME }}
          CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_PRODUCTION_SERVICE_ACCOUNT_TOKEN }}
          RECALL_WEBHOOK_SECRET: ${{ secrets.RECALL_WEBHOOK_SECRET }}
          CORE_PRODUCTION_IMAGE_REF: ${{ steps.production_digest.outputs.image }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CORE_PRODUCTION_IMAGE_REF" =~ ^cosmaneuraprodregistry\.azurecr\.io/cosmaneura/cosmaneura@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Refusing deploy without an admitted production Core digest."
            exit 1
          fi
          cd infra && bash deploy.sh "$CANDIDATE_SHA" "$CORE_PRODUCTION_IMAGE_REF"
