name: Pull Request Checks

# This workflow executes pull-request code and therefore receives no secrets,
# cloud identity, write-capable token, or production-state access.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Public, deliberately non-routable Clerk test identifier. Frontend module
  # initialization requires the publishable-key shape; PR code receives no
  # Clerk credential or secret expression.
  VITE_CLERK_PUBLIC_KEY: pk_test_Y2xlcmsucHVsbC1yZXF1ZXN0LmludmFsaWQk
  DATABASE_HOST: localhost
  REDIS_HOST: localhost
  SMTP_HOST: localhost
  COLUMNS: 120

jobs:
  ci-mode:
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - id: decide
        env:
          LIGHT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true && !contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [[ "$LIGHT" == "true" ]]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

  backend-quality:
    name: Backend quality
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/common-setup
        timeout-minutes: 10
        with:
          apt-packages: zsh
      - run: just up --fast
      - run: just py_setup
      - run: just py_lint
      - run: just db_migrate
      - run: just db_lint

  backend-tests:
    name: Backend tests (${{ matrix.shard }})
    needs: [ci-mode]
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'ci:full') && needs.ci-mode.outputs.full != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: application
            apt-packages: zsh
          - shard: infrastructure-core
            apt-packages: zsh
          - shard: infrastructure-sanitizer-source
            apt-packages: zsh
          - shard: infrastructure-sanitizer-evidence-exec
            apt-packages: zsh
          - shard: infrastructure-sanitizer-observer-bundle
            apt-packages: zsh
          - shard: infrastructure-sanitizer-connection-plan-bundle
            apt-packages: zsh
          - shard: infrastructure-sanitizer-bootstrap-bundle
            apt-packages: zsh
          - shard: infrastructure-restore
            apt-packages: zsh
          - shard: integration
            apt-packages: zsh libnss3-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/common-setup
        timeout-minutes: 10
        with:
          apt-packages: ${{ matrix.apt-packages }}
      - name: Install SHA-verified Localias
        if: ${{ matrix.shard == 'integration' }}
        run: bash scripts/install_pinned_localias.sh
      - run: just up --fast
      - run: just py_setup
      - name: Install integration Chromium headless shell
        if: ${{ matrix.shard == 'integration' }}
        run: uv run playwright install chromium --only-shell
      - name: Start SHA-verified Localias
        if: ${{ matrix.shard == 'integration' }}
        run: bash scripts/start_pinned_localias_ci.sh
      - run: just db_migrate
      - id: py_test
        run: just py_test-ci-${{ matrix.shard }}
      - name: Upload shard test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-${{ matrix.shard }}-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TEST_RESULTS_DIRECTORY }}
            ${{ env.PLAYWRIGHT_VISUAL_SNAPSHOT_DIRECTORY }}

  app:
    name: Backend
    needs: [backend-quality, backend-tests, ci-mode]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'ci:full') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every backend prerequisite to succeed
        env:
          BACKEND_QUALITY_RESULT: ${{ needs.backend-quality.result }}
          BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
        run: |
          if [[ "$BACKEND_QUALITY_RESULT" != "success" || "$BACKEND_TESTS_RESULT" != "success" ]]; then
            if [[ "$BACKEND_TESTS_RESULT" == "skipped" ]]; then
              echo "::error::Light draft run is red by design (backend-tests skipped). Add the ci:full label for a full run."
            else
              echo "::error::Backend prerequisites did not all succeed (quality=$BACKEND_QUALITY_RESULT, tests=$BACKEND_TESTS_RESULT)."
            fi
            exit 1
          fi

  web:
    name: Frontend
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/common-setup
        timeout-minutes: 10
        with:
          apt-packages: zsh
      - run: just js_setup
      - name: Generate OpenAPI client
        run: cd web && pnpm run openapi
      - run: just js_lint
      - run: just js_test
