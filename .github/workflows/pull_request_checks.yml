name: Pull Request Checks

# This workflow executes pull-request code and therefore receives no secrets,
# cloud identity, write-capable token, or production-state access.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Public, deliberately non-routable Clerk test identifier. Frontend module
  # initialization requires the publishable-key shape; PR code receives no
  # Clerk credential or secret expression.
  VITE_CLERK_PUBLIC_KEY: pk_test_Y2xlcmsucHVsbC1yZXF1ZXN0LmludmFsaWQk
  DATABASE_HOST: localhost
  REDIS_HOST: localhost
  SMTP_HOST: localhost
  COLUMNS: 120

jobs:
  ci-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.decide.outputs.full }}
    steps:
      - id: decide
        env:
          LIGHT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true && !contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          if [[ "$LIGHT" == "true" ]]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

  backend-quality:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/common-setup
        timeout-minutes: 10
        with:
          apt-packages: zsh
      - run: just up --fast
      - run: just py_setup
      - run: just py_lint
      - name: Test production workflow gates with synthetic fixtures
        run: python3 -B -m unittest discover -s ops/production-checks -p 'test_*.py'
      - run: just db_migrate
      - run: just db_lint

  backend-tests:
    name: Backend tests (${{ matrix.shard }})
    needs: [ci-mode]
    if: needs.ci-mode.outputs.full != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: application
            apt-packages: zsh
          - shard: infrastructure-general
            apt-packages: zsh
          - shard: infrastructure-controller
            apt-packages: zsh
          - shard: infrastructure-receipt-io
            apt-packages: zsh
          - shard: infrastructure-sanitizer-foundation
            apt-packages: zsh
          - shard: infrastructure-sanitizer-source-state-authority
            apt-packages: zsh
          - shard: infrastructure-sanitizer-source-state-context
            apt-packages: zsh
          - shard: infrastructure-sanitizer-source-state-integrity
            apt-packages: zsh
          - shard: infrastructure-sanitizer-evidence
            apt-packages: zsh
          - shard: infrastructure-sanitizer-evidence-integrity
            apt-packages: zsh
          - shard: infrastructure-sanitizer-executor
            apt-packages: zsh
          - shard: infrastructure-sanitizer-observer
            apt-packages: zsh
          - shard: infrastructure-sanitizer-observer-runtime
            apt-packages: zsh
          - shard: infrastructure-sanitizer-observer-output
            apt-packages: zsh
          - shard: infrastructure-sanitizer-observer-connection-plan
            apt-packages: zsh
          - shard: infrastructure-sanitizer-observer-connection-plan-state
            apt-packages: zsh
          - shard: infrastructure-sanitizer-observer-connection-plan-output
            apt-packages: zsh
          - shard: infrastructure-sanitizer-observer-connection-plan-contract
            apt-packages: zsh
          - shard: infrastructure-sanitizer-bootstrap-binding
            apt-packages: zsh
          - shard: infrastructure-sanitizer-bootstrap-binding-digest
            apt-packages: zsh
          - shard: infrastructure-sanitizer-bootstrap-binding-ancestry
            apt-packages: zsh
          - shard: infrastructure-sanitizer-bootstrap-binding-state
            apt-packages: zsh
          - shard: infrastructure-sanitizer-bootstrap-binding-output
            apt-packages: zsh
          - shard: infrastructure-sanitizer-bootstrap-binding-duplicate
            apt-packages: zsh
          - shard: infrastructure-sanitizer-bootstrap-binding-tamper
            apt-packages: zsh
          - shard: infrastructure-sanitizer-bootstrap-binding-failure
            apt-packages: zsh
          - shard: infrastructure-sanitizer-observer-integrity
            apt-packages: zsh
          - shard: infrastructure-sanitizer-data-contract-executor
            apt-packages: zsh
          - shard: infrastructure-sanitizer-source-snapshot
            apt-packages: zsh
          - shard: infrastructure-restore
            apt-packages: zsh
          - shard: integration
            apt-packages: zsh libnss3-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/common-setup
        timeout-minutes: 10
        with:
          apt-packages: ${{ matrix.apt-packages }}
      - name: Install SHA-verified Localias
        if: ${{ matrix.shard == 'integration' }}
        run: bash scripts/install_pinned_localias.sh
      - run: just up --fast
      - run: just py_setup
      - name: Install integration Chromium headless shell
        if: ${{ matrix.shard == 'integration' }}
        run: uv run playwright install chromium --only-shell
      - name: Start SHA-verified Localias
        if: ${{ matrix.shard == 'integration' }}
        run: bash scripts/start_pinned_localias_ci.sh
      - run: just db_migrate
      - id: py_test
        run: just py_test-ci-${{ matrix.shard }}
      - name: Upload shard test artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-${{ matrix.shard }}-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.TEST_RESULTS_DIRECTORY }}
            ${{ env.PLAYWRIGHT_VISUAL_SNAPSHOT_DIRECTORY }}

  scribe-runtime-real-build:
    needs: [ci-mode]
    if: needs.ci-mode.outputs.full != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHON_ENV: staging
      CONTAINER_REGISTRY_HOST: cosmaneurastagingregistry.azurecr.io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/common-setup
        with:
          apt-packages: zsh
      - uses: ./.github/actions/install-nixpacks
      - name: Build real amd64 Core substrate
        env:
          PYTHON_ENV: staging
        # Same environment arguments and labels as just build, without frontend
        # credentials. Save the plain substrate for independent refusal tests.
        run: |
          set -euo pipefail
          just _build_python_substrate
          docker tag "cosmaneura:$(git rev-parse HEAD)" core-proof:pr
      - name: Derive twice from cold builder caches
        id: derive
        run: |
          set -euo pipefail
          docker builder prune -af
          digest_a=$(python3 -m scripts.build_scribe_runtime --core-image core-proof:pr --derive-runtime-digest --manifest-out "$RUNNER_TEMP/runtime-a.txt")
          docker builder prune -af
          digest_b=$(python3 -m scripts.build_scribe_runtime --core-image core-proof:pr --derive-runtime-digest --manifest-out "$RUNNER_TEMP/runtime-b.txt")
          pin=$(python3 -c 'from scripts.scribe_runtime_pin import SCRIBE_RUNTIME_IMAGE_DIGEST; print(SCRIBE_RUNTIME_IMAGE_DIGEST)')
          printf 'Cold derivation A: `%s`\n\nCold derivation B: `%s`\n\nReviewed pin: `%s`\n' "$digest_a" "$digest_b" "$pin" >> "$GITHUB_STEP_SUMMARY"
          printf 'digest_a=%s\ndigest_b=%s\npin=%s\n' "$digest_a" "$digest_b" "$pin" >> "$GITHUB_OUTPUT"
          printf 'Cold derivation A: %s\nCold derivation B: %s\nReviewed pin: %s\n' "$digest_a" "$digest_b" "$pin"
          if [[ "$digest_a" != "$digest_b" ]] || ! cmp "$RUNNER_TEMP/runtime-a.txt" "$RUNNER_TEMP/runtime-b.txt"; then
            echo "::error::Scribe runtime is non-reproducible across two cold derivations."
            exit 1
          fi
      - name: Upload public runtime manifests
        if: ${{ always() && steps.derive.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scribe-runtime-cold-manifests
          path: |
            ${{ runner.temp }}/runtime-a.txt
            ${{ runner.temp }}/runtime-b.txt
          if-no-files-found: warn
      - name: Assert hosted runtime equals reviewed pin
        env:
          DERIVED: ${{ steps.derive.outputs.digest_a }}
          PIN: ${{ steps.derive.outputs.pin }}
        run: |
          if [[ "$DERIVED" != "$PIN" ]]; then
            echo "::error::Hosted runtime digest $DERIVED differs from SCRIBE_RUNTIME_IMAGE_DIGEST $PIN."
            exit 1
          fi
      - name: Build and verify the real bundled path
        env:
          PYTHON_ENV: staging
        run: |
          set -euo pipefail
          just _build_python_image
          just _scribe_runtime_prepare_check
          docker tag "cosmaneura:$(git rev-parse HEAD)" core-proof:bundled
          set +e
          python3 -m scripts.scribe_runtime_check --image core-proof:pr
          plain_status=$?
          set -e
          [[ "$plain_status" == 1 ]] || { echo "::error::Plain Core must exit 1; got $plain_status."; exit 1; }
      - name: Run existing opt-in real image tests
        env:
          CORE_SCRIBE_SYNTHETIC_PLAIN_IMAGE: core-proof:pr
          CORE_SCRIBE_SYNTHETIC_BUNDLED_IMAGE: core-proof:bundled
          PYTHON_ENV: test
        run: uv run --frozen pytest --noconftest -p no:pretty_traceback tests/infrastructure/test_scribe_runtime_image.py::test_real_docker_synthetic_image_without_runtime_refuses tests/infrastructure/test_scribe_runtime_image.py::test_real_docker_synthetic_image_with_runtime_passes

  app:
    name: Backend
    needs: [backend-quality, backend-tests, ci-mode, scribe-runtime-real-build]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every backend prerequisite to succeed
        env:
          BACKEND_QUALITY_RESULT: ${{ needs.backend-quality.result }}
          BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
          SCRIBE_RUNTIME_REAL_BUILD_RESULT: ${{ needs.scribe-runtime-real-build.result }}
        run: |
          if [[ "$BACKEND_QUALITY_RESULT" != "success" || "$BACKEND_TESTS_RESULT" != "success" || "$SCRIBE_RUNTIME_REAL_BUILD_RESULT" != "success" ]]; then
            if [[ "$BACKEND_TESTS_RESULT" == "skipped" || "$SCRIBE_RUNTIME_REAL_BUILD_RESULT" == "skipped" ]]; then
              echo "::error::Light draft run is red by design (backend-tests skipped). Add the ci:full label for a full run."
            else
              echo "::error::Backend prerequisites did not all succeed (quality=$BACKEND_QUALITY_RESULT, tests=$BACKEND_TESTS_RESULT)."
              echo "::error::Scribe runtime real build result: $SCRIBE_RUNTIME_REAL_BUILD_RESULT."
            fi
            exit 1
          fi

  web:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/common-setup
        timeout-minutes: 10
        with:
          apt-packages: zsh
      - run: just js_setup
      - name: Generate OpenAPI client
        run: cd web && pnpm run openapi
      - run: just js_lint
      - run: just js_test
