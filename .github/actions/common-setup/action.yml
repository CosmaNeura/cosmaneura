name: 'Common Setup'
description: "Internal action for common setup across jobs"
# NOTE timeout-minutes *cannot* bet set within a action and must be set at the root level
runs:
  using: 'composite'
  steps:
    # NOTE cannot run checkout in this local action, must be run by the parent action
    # mise can rarely get stuck installing. It normally takes < 10s to install, so this should never be more than a minute
    - uses: jdx/mise-action@v4
      with:
        version: 2025.3.6
    # Inlined apt install to avoid `iloveitaly/actions-use-apt-tools` (Node 20
    # via actions/cache@v4). Caching /var/cache/apt/archives is skipped: the
    # dir's root-owned `partial/` subdir made cache@v5 emit a tar-exit-2
    # warning at save-time, and the savings (~5s/job) didn't justify the noise.
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          zsh libnss3-tools poppler-utils ffmpeg
    # without any additional options, this simply installs the latest version of the cli
    # keep this non-blocking: CI can continue with direct GitHub secrets if OP auth is unavailable
    - uses: 1password/load-secrets-action@v4
      continue-on-error: true
    - uses: iloveitaly/github-action-direnv-load-and-mask@master
      with:
        environment_allowlist: >
          PYTHON_TEST_SERVER_HOST,
          JAVASCRIPT_SERVER_HOST,
          VITE_PYTHON_URL,
          OPENAPI_JSON_PATH,
          TMP_DIRECTORY,
          TEST_RESULTS_DIRECTORY,
          PLAYWRIGHT_RESULT_DIRECTORY,
          VIRTUAL_ENV,
          PATH
    # cache node_modules
    - uses: actions/cache@v5
      with:
        path: web/node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('web/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-node-modules
