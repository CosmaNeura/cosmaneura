name: 'Common Setup'
description: "Internal action for common setup across jobs"
# NOTE timeout-minutes *cannot* bet set within a action and must be set at the root level
inputs:
  apt-packages:
    description: >
      Space-separated apt packages to install. Deploy jobs override this to just
      "zsh" (the only host dependency for `just`); ffmpeg & friends are app
      runtime deps that live inside the Docker image, not on the deploy host, so
      pulling their ~69MB/91-package tree there only risks the apt-mirror stall.
    default: "zsh libnss3-tools poppler-utils ffmpeg"
runs:
  using: 'composite'
  steps:
    # NOTE cannot run checkout in this local action, must be run by the parent action
    # mise can rarely get stuck installing. It normally takes < 10s to install, so this should never be more than a minute
    - uses: jdx/mise-action@v4
      with:
        version: 2025.3.6
    # Inlined apt install to avoid `iloveitaly/actions-use-apt-tools` (Node 20
    # via actions/cache@v4). Caching /var/cache/apt/archives is skipped: the
    # dir's root-owned `partial/` subdir made cache@v5 emit a tar-exit-2
    # warning at save-time, and the savings (~5s/job) didn't justify the noise.
    # Harden apt against the Azure Ubuntu mirror intermittently stalling mid-
    # download: a ~3min hang fetching ffmpeg's deps has blown the 5min
    # common-setup timeout. Cap each connection at 30s and retry up to 3 times
    # so a stalled fetch aborts and retries instead of hanging to the timeout.
    - shell: bash
      env:
        APT_OPTS: "-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
        APT_PACKAGES: ${{ inputs.apt-packages }}
      run: |
        sudo apt-get $APT_OPTS update -qq
        sudo apt-get $APT_OPTS install -y --no-install-recommends $APT_PACKAGES
    # without any additional options, this simply installs the latest version of the cli
    # keep this non-blocking: CI can continue with direct GitHub secrets if OP auth is unavailable
    - uses: 1password/load-secrets-action@v4
      continue-on-error: true
    - uses: iloveitaly/github-action-direnv-load-and-mask@master
      with:
        environment_allowlist: >
          PYTHON_TEST_SERVER_HOST,
          JAVASCRIPT_SERVER_HOST,
          VITE_PYTHON_URL,
          OPENAPI_JSON_PATH,
          TMP_DIRECTORY,
          TEST_RESULTS_DIRECTORY,
          PLAYWRIGHT_RESULT_DIRECTORY,
          VIRTUAL_ENV,
          PATH
    # cache node_modules
    - uses: actions/cache@v5
      with:
        path: web/node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('web/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-node-modules
