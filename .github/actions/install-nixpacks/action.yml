name: Install pinned Nixpacks
description: Install the reviewed Nixpacks release after verifying its archive digest

runs:
  using: composite
  steps:
    - name: Download and verify Nixpacks 1.41.0
      shell: bash
      env:
        # Digest published for this exact GitHub release asset.
        NIXPACKS_ARCHIVE_SHA256: 194bcad8c379f78a309eee1a88b2e6b2abc59f354efe7ecd7b4bbaf21de99a06
        NIXPACKS_ARM64_ARCHIVE_SHA256: 912bd02dd2bb6f9c3a9ed965fe8a68b4aa318dc7a2546e2eca6f2806a894ba39
        NIXPACKS_VERSION: 1.41.0
      run: |
        set -euo pipefail
        install_root=$(mktemp -d "$RUNNER_TEMP/nixpacks.XXXXXX")
        chmod 0700 "$install_root"
        bin_dir="$install_root/bin"
        case "$(uname -m)" in
          x86_64) target=x86_64-unknown-linux-gnu ;;
          aarch64)
            target=aarch64-unknown-linux-musl
            NIXPACKS_ARCHIVE_SHA256="$NIXPACKS_ARM64_ARCHIVE_SHA256"
            ;;
          *) echo "No pinned Nixpacks asset for this runner architecture." >&2; exit 1 ;;
        esac
        archive="$install_root/nixpacks-v${NIXPACKS_VERSION}-${target}.tar.gz"
        url="https://github.com/railwayapp/nixpacks/releases/download/v${NIXPACKS_VERSION}/nixpacks-v${NIXPACKS_VERSION}-${target}.tar.gz"

        curl \
          --fail \
          --location \
          --proto '=https' \
          --retry 3 \
          --retry-all-errors \
          --show-error \
          --silent \
          --tlsv1.2 \
          --output "$archive" \
          "$url"
        printf '%s  %s\n' "$NIXPACKS_ARCHIVE_SHA256" "$archive" |
          sha256sum --check --strict
        archive_entries=$(tar -tzf "$archive")
        archive_type=$(tar -tvzf "$archive" | cut -c1)
        if [[ "$archive_entries" != "nixpacks" || "$archive_type" != "-" ]]; then
          echo "The pinned Nixpacks archive must contain one regular file." >&2
          exit 1
        fi

        install -d -m 0700 "$bin_dir"
        tar -xzf "$archive" -C "$bin_dir" nixpacks
        if [[ ! -f "$bin_dir/nixpacks" || -L "$bin_dir/nixpacks" ]]; then
          echo "The extracted Nixpacks executable is not a regular file." >&2
          exit 1
        fi
        chmod 0755 "$bin_dir/nixpacks"
        "$bin_dir/nixpacks" --version
        printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
