# Inputs consumed by tests/builds, including offline infrastructure contracts.
# Ordinary docs/flight-plans do not require application or browser workers.
backend:
  - 'app/**'
  - 'migrations/**'
  - 'tests/**'
  - 'scripts/**'
  - 'contracts/**'
  - 'infra*/**'
  - '.cursor/**'
  - '.github/**'
  - 'just/**'
  - 'justfile'
  - 'Justfile'
  - '*.py'
  - '*.toml'
  - '*.ini'
  - 'uv.lock'
  - 'requirements*'
  - '.env*'
  - '.tool-versions'
  - '.service-versions'
  - 'docker-compose*.yml'
  - 'Dockerfile*'
  - 'Procfile*'
  - '.dockerignore'
  - 'nixpacks*'
  - 'web/**'
  - 'docs/*.md'
  - 'docs/flight-plans/2026-09-04-staging-rehearsal-base-recovery.md'
frontend:
  - 'web/**'
  - 'just/**'
  - 'justfile'
  - 'Justfile'
  - '.github/**'
  - '.env*'
  - '.tool-versions'
  - 'package.json'
  - '*lock*'
  - '*config*'
  - '.npmrc'
  - '.pnpmfile.cjs'
